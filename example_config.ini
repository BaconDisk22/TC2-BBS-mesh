###############################
#### Select Interface type ####
###############################
# [type = serial] for USB connected devices
#If there are multiple serial devices connected, be sure to use the "port" option and specify a port
# Linux Example:
# port = /dev/ttyUSB0
#
# Windows Example:
# port = COM3
# [type = tcp] for network connected devices (ESP32 devices only - this does not work for WisBlock)
# If using tcp, remove the # from the beginning and replace 192.168.x.x with the IP address of your device
# Example:
# [interface]
# type = tcp
# hostname = 192.168.1.100

[interface]
type = serial
# port = /dev/ttyACM0
# hostname = 192.168.x.x


############################
#### BBS NODE SYNC LIST ####
############################
# Provide a list of other nodes running TC²-BBS to sync mail messages and bulletins with
# Enter in a list of other BBS Nodes by their nodeID separated by commas (no spaces)
# Example:
# [sync]
# bbs_nodes = !17d7e4b7,!18e9f5a3,!1a2b3c4d

# [sync]
# bbs_nodes = !17d7e4b7


############################
#### Allowed Node IDs ####
############################
# Provide a list of node IDs that are allowed to post to the urgent board.
# If this section is commented out, anyone can post to the urgent board.
# Example:
# [allow_list]
# allowed_nodes = 12345678,87654321
#
# [allow_list]
# allowed_nodes = !17d7e4b7


####################
#### Menu Items ####
####################
# Remove any menu items you don't plan on using with your BBS below
#
[menu]
# Default Main Menu options for reference
# [Q]uick Commands
# [B]BS
# [U]tilities
# E[X]IT
#
# Remove any menu items from the list below that you want to exclude from the main menu
main_menu_items = Q, B, U, X

# Default BBS Menu options for reference
# [M]ail
# [B]ulletins
# [C]hannel Dir
# [J]S8CALL
# E[X]IT
#
# Remove any menu items from the list below that you want to exclude from the BBS menu
bbs_menu_items = M, B, C, J, X

# Default Utilities Menu option for reference
# [S]tats
# [F]ortune
# [W]all of Shame
# E[X]IT
#
# Remove any menu items from the list below that you want to exclude from the utilities menu
utilities_menu_items = S, F, W, X


##########################
#### JS8Call Settings ####
##########################
# If you would like messages from JS8Call to go into the BBS, uncomment and enter in info below:
# host = the IP address for your system running JS8Call
# port = TCP API port for JS8CALL - Default is 2442
# db_file = this can be left as the default "js8call.db" unless you need to change for some reason
# js8groups = the JS8Call groups you're interested in receiving into the BBS
# store_messages = "true" will send messages that arent part of a group into the BBS (can be noisy). "false" will ignore these
# js8urgent = the JS8Call groups you consider to be urgent - anything sent to these will have a notice sent to the
# group chat (similar to how the urgent bulletin board works
# [js8call]
# host = 192.168.1.100
# port = 2442
# db_file = js8call.db
# js8groups = @GRP1,@GRP2,@GRP3
# store_messages = True
# js8urgent = @URGNT


# Empty list denies remote announcements; separate from urgent-board permissions.
[announcements]
# Persistent broadcast cooldown (minimum 60 seconds).
cooldown_seconds = 60
admin_nodes =

# Once per server process start, including manual/crash restart. Disabled by default.
[startup]
# Persistent restart cooldown (minimum 300 seconds).
cooldown_seconds = 3600
enabled = false
channel = 0
# Empty uses public greeting. Custom text is verbatim, max 200 UTF-8 bytes.
message =

[personality]
public_mode = clean
allow_public_profanity = false


[weather]
# Local report works with no internet; operator supplies its timestamp.
local_report =
internet_enabled = false
# Required only when internet weather is enabled; no automatic location lookup.
latitude = 40.20
longitude = -74.50

# Optional CentralNJ monitoring: configure your radio's CentralNJ channel separately.
# This MQTT counter is receive-only and does not decrypt or send Meshtastic packets.
# For CentralNJ use host mqtt.meshtastic.org, with your broker's authorized
# credentials and a deliberately scoped subscription topic. Do not paste
# PSKs or passwords into a public repository.
# For two-way messaging, configure MQTT uplink/downlink on the Meshtastic
# radio itself and use its normal radio transport; direct desktop MQTT
# transmission is not implemented.
[mqtt_monitor]
enabled = false
# Explicit broker/topic required. No default broker or shared credentials.
host =
topic =
tls = true
port = 8883
username =
password =

# Optional links to other software. Everything here is OFF by default.
# See docs/INTEGRATIONS.md (webhooks, Claude assistant link, Prometheus/InfluxDB/Grafana).
[integrations]
# Webhooks: POST a small JSON document for each selected radio event.
webhooks_enabled = False
# Comma separated http:// or https:// URLs
webhook_urls =
# Any of: message, node, telemetry
webhook_events = message,node,telemetry
# Set False to leave channel message text out of webhook bodies
webhook_include_text = True
# Optional shared secret; adds X-Mesh-Signature: sha256=<HMAC of the body>
webhook_secret =
# Assistant link + metrics: a small web server on 127.0.0.1 only (never the network).
local_api_enabled = False
local_api_port = 9480
metrics_enabled = True
# Let the assistant post to channels (same checks and rate limit as desktop chat).
assistant_send_enabled = False
# Telemetry history as InfluxDB line protocol: a file (relative = integrations/ folder)
influx_file =
# and/or an InfluxDB v2 write URL, e.g. http://127.0.0.1:8086/api/v2/write?org=home&bucket=mesh&precision=s
influx_url =
influx_token =
